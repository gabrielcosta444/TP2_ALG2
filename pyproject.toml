[project]
name = "tp2-alg2"
version = "0.1.0"
description = "Algoritmos e experimentos para o TSP geométrico"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "networkx>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

